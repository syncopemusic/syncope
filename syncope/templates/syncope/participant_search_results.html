{% if add_form.fields.person.queryset.exists %}
    <div id="participant-checkbox-list">{{ add_form.person }}</div>
    <div style="display:flex; gap:0.75rem; align-items:center; margin-top:0.5rem;">
        <button type="button" id="stage-add-participant-btn">Add participants</button>
        <form method="post" action="{% url 'syncope:save_draft_and_go' %}?goto={% url 'syncope:org_member_new' url_username %}?auto_add_event={{ event.pk }}&next={% url 'syncope:event_attendance_edit' url_username event.pk %}?origin={{ origin_key }}" style="margin:0;">
            {% csrf_token %}
            <button type="submit" title="Create new person">+ New Person</button>
        </form>
    </div>
{% elif search_q %}
    <p>No matching persons found.</p>
{% else %}
    <p>All org members are already in this event's attendance.</p>
{% endif %}

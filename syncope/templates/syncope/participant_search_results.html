{% if search_q %}
    <p class="result-count">{{ add_form.fields.person.queryset|length }} result{{ add_form.fields.person.queryset|length|pluralize }}</p>
    {% if add_form.fields.person.queryset.exists %}
        <div id="participant-checkbox-list">
            {% for person in add_form.fields.person.queryset %}
                <div class="search-result-row"><button type="button" class="btn btn-secondary" data-id="{{ person.pk }}">+</button> <span class="result-label">{{ person }}</span></div>
            {% endfor %}
        </div>
    {% endif %}
    <div class="search-result-row">
        <button type="submit" form="attendance-form" name="action" value="new_person" class="btn btn-primary" title="Create new person">+ New person</button>
    </div>
{% endif %}

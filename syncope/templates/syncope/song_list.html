{% extends "syncope/base.html" %}
{% load static %}
{% block title %}Songs{% endblock %}
{% block content %}

<div class="section-header">
    <h1>Songs</h1>
    <a href="{%  url 'syncope:song_new' url_username %}" class="btn btn-primary" title="Add new song into archive">+ Add</a>
</div>

<p class="search-form">
    <span style="position:relative; flex:1; min-width:200px;">
        <input type="text" id="song-list-search-input" value="{{ q }}" placeholder="Search by ID, title, composer, arranger, poet, origin, keywords, language" style="width:100%; box-sizing:border-box;">
        <span class="search-spinner" id="song-list-search-spinner"></span>
    </span>
    <button type="button" id="song-list-search-clear" class="btn btn-secondary">Clear</button>
</p>

<div id="song-list-results">
    {% include "syncope/song_list_results.html" %}
</div>

{% block extra_js %}
<script src="{% static 'syncope/search-box.js' %}"></script>
<script>
    initLiveSearch({
        input: document.getElementById('song-list-search-input'),
        spinner: document.getElementById('song-list-search-spinner'),
        results: document.getElementById('song-list-results'),
        clearBtn: document.getElementById('song-list-search-clear'),
        buildUrl: query => `{% url 'syncope:song_list_search' url_username %}?q=${encodeURIComponent(query)}`,
    });
</script>
{% endblock %}

{% endblock %}

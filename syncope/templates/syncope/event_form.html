{% extends "syncope/base.html" %}

{% block title %}{% if form.instance.pk %}Edit{% else %}New{% endif %} Event{% endblock %}

{% block content %}
<h1>New event</h1>
<form method="post">
    {% csrf_token %}
    <input type="hidden" name="draft_key" value="{{ draft_key }}">
    {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create</button>
    </div>
</form>
{% endblock %}

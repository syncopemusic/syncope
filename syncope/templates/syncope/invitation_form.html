{% extends "syncope/base.html" %}
{% block title %}Invitations - Syncope{% endblock %}

{% block content %}
<div class="section-header">
    <h1 class="event-title">
        <span class="event-title-text">
            <span title="{% if is_org %}Organization{% else %}Username{% endif %}">{{ owner_name }}</span>
            <small><span title="Action"> | New Invitation</span></small>
        </span>
    </h1>
</div>

{% if is_org %}
<form method="post" class="inline-form">
    {% csrf_token %}
    <input type="hidden" name="draft_key" value="{{ draft_key }}">
    <button type="submit"
            class="btn btn-primary"
            formaction="{% url 'syncope:save_draft_and_go' %}?goto={% url 'syncope:org_member_new' url_username %}&next={{ request.get_full_path|urlencode }}"
            title="Create new person" hidden>+ Add</button>
</form>
{% endif %}

<form method="post" id="invitation-form">
    {% csrf_token %}
    <input type="hidden" name="draft_key" value="{{ draft_key }}">
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send</button>
    </div>
</form>
{% endblock %}

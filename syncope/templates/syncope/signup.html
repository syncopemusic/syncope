{% extends "syncope/base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<h2>Sign Up</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Signup</button>
  </div>
</form>

<p><a href="{% url 'syncope:login' %}" class="btn btn-link">Log In</a></p>
{% endblock %}

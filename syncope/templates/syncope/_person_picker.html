<div class="form-group person-picker" data-field="{{ field_name }}" data-search-url="{% url 'syncope:song_person_search' url_username field_name %}" data-next="{{ request.get_full_path }}">
    <label>{{ label }}</label>
    {{ field }}
    <div class="link-row">
        <p style="position:relative; flex: 1 1 auto; margin: 0;">
            <input type="text" class="person-picker-input" value="{{ current|default:'' }}" placeholder="Search {{ label }}" autocomplete="off" style="width:100%; box-sizing:border-box;">
            <span class="search-spinner person-picker-spinner"></span>
        </p>
    </div>
    <div class="person-picker-results" hidden></div>
    {% if field.errors %}<p class="form-help">{{ field.errors }}</p>{% endif %}
</div>

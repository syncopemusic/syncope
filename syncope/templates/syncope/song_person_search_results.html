{% if search_q is not None %}
    <p class="result-count">{{ persons|length }} result{{ persons|length|pluralize }}</p>
    {% if persons %}
        <div>
            {% for person in persons %}
                <div class="search-result-row"><button type="button" class="btn btn-secondary" data-id="{{ person.pk }}">Select</button> <span class="result-label">{{ person }}</span></div>
            {% endfor %}
        </div>
    {% else %}
        <p>No matching persons found.</p>
    {% endif %}
    {% if search_q %}
        <div class="search-result-row">
            <button type="submit" class="btn btn-primary" formnovalidate
                    formaction="{% url 'syncope:save_draft_and_go' %}?goto={% url new_person_url_name url_username %}&next={{ next|urlencode }}"
                    title="Add new {{ label }}">+ New {{ label }}</button>
        </div>
    {% endif %}
{% endif %}

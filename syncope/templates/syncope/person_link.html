{% if person %}
    <a href="{%  url 'syncope:org_member_detail' url_username person.pk %}{% if from_event %}?from_event={{ from_event }}&origin={{ origin }}{% endif %}"
    title="{{ person }} {{ person.birth_date|date:'Y' }}-{{ person.death_date|date:'Y' }}">
        {{ person }}
    </a>
{% else %}
    -
{% endif %}

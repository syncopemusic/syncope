{% extends "syncope/base.html" %}
{% block title %}Password reset{% endblock %}
{% block content %}
<h2>Password reset</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Reset</button>
  </div>
</form>
{% endblock %}

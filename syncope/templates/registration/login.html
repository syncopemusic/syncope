{% extends "syncope/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Login</button>
  </div>
</form>
<p><a href="{% url 'syncope:signup' %}" class="btn btn-link">Sign up form</a></p>
{% endblock %}
